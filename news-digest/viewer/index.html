<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>줍줍 뉴스 뷰어</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e4e2da;
    --accent: #1f6f5c; --accent-soft: #e3f0ec; --warn: #9a5b00; --warn-soft: #fbf0dc;
    --chip: #efede6; --link: #1d5fa8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9d9b93; --line: #33322e;
      --accent: #6cc4a9; --accent-soft: #1d332c; --warn: #e3b05c; --warn-soft: #3a2f1b;
      --chip: #2a2a26; --link: #7fb2ec;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  a { color: var(--link); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 14px;
    border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  .tab.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .spacer { flex: 1; }
  .ghost { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 12px;
    border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
  .ghost:hover { color: var(--ink); }
  .updated { color: var(--muted); font-size: 12px; }

  .wrap { display: grid; grid-template-columns: 230px 1fr; gap: 0; min-height: calc(100vh - 58px); }
  aside { border-right: 1px solid var(--line); padding: 16px 12px; overflow-y: auto; max-height: calc(100vh - 58px); position: sticky; top: 58px; }
  aside h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 4px 8px 8px; letter-spacing: .04em; }
  .day { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 7px 8px;
    border: 0; background: transparent; color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; }
  .day:hover { background: var(--chip); }
  .day.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .day .d { flex: 1; font-variant-numeric: tabular-nums; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.s { background: var(--accent-soft); color: var(--accent); }

  main { padding: 24px 32px 64px; min-width: 0; }
  .doc { max-width: 820px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px; }
  .seg button.on { background: var(--ink); color: var(--panel); }
  .seg button:disabled { opacity: .4; cursor: default; }
  .meta { color: var(--muted); font-size: 12px; }

  .notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; }

  .md h1 { font-size: 22px; margin: 0 0 12px; letter-spacing: -0.02em; }
  .md h2 { font-size: 16px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 15px; margin: 20px 0 8px; }
  .md p { margin: 8px 0; }
  .md ul { padding-left: 20px; margin: 8px 0; }
  .md li { margin: 8px 0; }
  .md li .src { display: block; font-size: 13px; color: var(--muted); word-break: break-all; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .md em { color: var(--muted); }
  .md code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .md blockquote { margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--line); color: var(--muted); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filters input, .filters select { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .filters input { flex: 1; min-width: 180px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 4px 10px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
  .item a.t { font-weight: 600; text-decoration: none; color: var(--ink); }
  .item a.t:hover { color: var(--link); text-decoration: underline; }
  .item .info { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .item .desc { font-size: 14px; color: var(--muted); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .more { display: block; margin: 12px auto; }

  details.log { margin-top: 28px; max-width: 820px; }
  details.log summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.log pre { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 4px; padding: 10px 16px; }
    aside h2 { display: none; }
    .day { width: auto; white-space: nowrap; }
    main { padding: 16px; }
    .card { padding: 18px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>줍줍 <span>뉴스 뷰어</span></h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <span class="updated" id="updated"></span>
  <button class="ghost" id="reload">새로고침</button>
</header>
<div class="wrap">
  <aside id="days"></aside>
  <main id="main"><div class="empty">불러오는 중…</div></main>
</div>

<script>
const state = { data: null, section: "daily", date: null, view: "summary", countryCode: null,
  raw: { items: [], source: "all", keyword: "", q: "", shown: 60 } };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SRC_LABEL = { news: "뉴스", blog: "블로그", cafearticle: "카페", exa: "웹검색", tiktok: "틱톡" };
const srcLabel = (s) => SRC_LABEL[s] || (s.startsWith("rss:") ? "RSS·" + s.slice(4) : s.startsWith("reddit:") ? "Reddit·" + s.slice(7) : s);

// ---------- 간단한 마크다운 렌더러 (요약 파일 형식에 맞춤) ----------
function inline(s) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return out;
}
function renderMd(md) {
  const lines = md.replace(/\r/g, "").split("\n");
  let html = "", inList = false, li = null, para = [];
  const flushPara = () => { if (para.length) { html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const flushLi = () => { if (li) { html += "<li>" + li.map((l, i) => i === 0 ? inline(l)
      : /^원문\s*:/.test(l) ? '<span class="src">' + inline(l) + "</span>" : "<br>" + inline(l)).join("") + "</li>"; li = null; } };
  const closeList = () => { flushLi(); if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushPara(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushPara(); closeList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushPara(); closeList(); html += "<hr>"; continue; }
    if ((m = line.match(/^\s{0,1}[-*]\s+(.*)$/))) { flushPara(); flushLi(); if (!inList) { html += "<ul>"; inList = true; } li = [m[1]]; continue; }
    if (li && /^\s+\S/.test(raw)) { li.push(line.trim().replace(/^[-*]\s+/, "")); continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); closeList(); html += "<blockquote>" + inline(m[1]) + "</blockquote>"; continue; }
    closeList(); para.push(line);
  }
  flushPara(); closeList();
  return html;
}

// ---------- 데이터 ----------
async function loadList() {
  state.data = await (await fetch("/api/list")).json();
  $("#updated").textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  const days = state.data[state.section].days;
  if (!state.date || !days.find((d) => d.date === state.date)) pickDefaultDate();
  renderTabs(); renderDays();
}
function pickDefaultDate() {
  const days = state.data[state.section].days;
  const withSummary = days.find((d) => d.summary);
  state.date = days[0]?.date || null;
  state.view = days[0]?.summary ? "summary" : "raw";
  // 최신 날짜에 요약이 없으면 요약 있는 최신 날짜를 먼저 보여줌
  if (days[0] && !days[0].summary && withSummary) { state.date = withSummary.date; state.view = "summary"; }
}
function currentDay() { return state.data[state.section].days.find((d) => d.date === state.date); }

// ---------- 화면 ----------
function renderTabs() {
  $("#tabs").innerHTML = Object.entries(state.data).map(([k, v]) =>
    `<button class="tab ${k === state.section ? "on" : ""}" data-k="${k}">${esc(v.label)}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach((b) => b.onclick = () => {
    state.section = b.dataset.k; state.date = null; state.countryCode = null; pickDefaultDate(); renderTabs(); renderDays(); renderMain();
  });
}
function renderDays() {
  const sec = state.data[state.section];
  const days = sec.days;
  let html = `<h2>날짜</h2>` + (days.length ? days.map((d) =>
    `<button class="day ${!state.countryCode && d.date === state.date ? "on" : ""}" data-d="${d.date}">
       <span class="d">${d.date}</span>
       ${d.summary ? '<span class="badge s">요약</span>' : ""}${d.raw ? '<span class="badge">원본</span>' : ""}
     </button>`).join("") : '<div class="empty">아직 결과 없음</div>');
  if (sec.countries) {
    html += `<h2>국가별 리서치</h2>` + sec.countries.map((c) =>
      `<button class="day ${state.countryCode === c.code ? "on" : ""}" data-c="${c.code}">
         <span class="d">${esc(c.label)}</span>
         ${c.updated ? `<span class="badge s">${new Date(c.updated).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" })}</span>` : '<span class="badge">조사 전</span>'}
       </button>`).join("");
  }
  $("#days").innerHTML = html;
  $("#days").querySelectorAll(".day[data-d]").forEach((b) => b.onclick = () => {
    state.date = b.dataset.d; state.countryCode = null; const d = currentDay();
    if (state.view === "summary" && !d.summary) state.view = "raw";
    if (state.view === "raw" && !d.raw) state.view = "summary";
    renderDays(); renderMain();
  });
  $("#days").querySelectorAll(".day[data-c]").forEach((b) => b.onclick = () => {
    state.countryCode = b.dataset.c; state.date = null;
    renderDays(); renderMain();
  });
}
async function renderMain() {
  const main = $("#main");
  if (state.countryCode) {
    const sec = state.data[state.section];
    const c = (sec.countries || []).find((x) => x.code === state.countryCode);
    main.innerHTML = `<div class="bar"><span class="meta">${c && c.updated ? "최종 갱신 " + new Date(c.updated).toLocaleString("ko-KR") : "아직 조사 전"}</span></div><div id="content"><div class="empty">불러오는 중…</div></div>`;
    const box = $("#content");
    const r = await (await fetch(`/api/country/${state.countryCode}`)).json();
    box.innerHTML = r.error
      ? '<div class="empty">아직 이 나라는 조사된 내용이 없어요.</div>'
      : `<div class="doc"><div class="card md">${renderMd(r.markdown)}</div></div>`;
    return;
  }
  const d = currentDay();
  const sec = state.data[state.section];
  if (!d) { main.innerHTML = '<div class="empty">이 폴더에는 아직 결과 파일이 없어요.</div>'; return; }
  const latestRaw = sec.days.find((x) => x.raw);
  let html = `<div class="bar">
      <div class="seg">
        <button data-v="summary" class="${state.view === "summary" ? "on" : ""}" ${d.summary ? "" : "disabled"}>요약</button>
        <button data-v="raw" class="${state.view === "raw" ? "on" : ""}" ${d.raw ? "" : "disabled"}>수집 원본</button>
      </div>
      <span class="meta">${d.raw ? "원본 수집 " + new Date(d.raw.mtime).toLocaleString("ko-KR") : ""}</span>
    </div>`;
  if (latestRaw && !latestRaw.summary && state.view === "summary")
    html += `<div class="notice">${latestRaw.date} 수집 원본은 있지만 아직 요약이 작성되지 않았어요. 왼쪽 목록에서 그 날짜를 눌러 원본을 볼 수 있어요.</div>`;
  html += `<div id="content"><div class="empty">불러오는 중…</div></div>`;
  if (sec.log) html += `<details class="log"><summary>수집 로그 (최근)</summary><pre>${esc(sec.log)}</pre></details>`;
  main.innerHTML = html;
  main.querySelectorAll(".seg button").forEach((b) => b.onclick = () => { state.view = b.dataset.v; renderMain(); });

  const box = $("#content");
  if (state.view === "summary") {
    const r = await (await fetch(`/api/summary/${state.section}/${d.date}`)).json();
    box.innerHTML = `<div class="doc"><div class="card md">${renderMd(r.markdown)}</div></div>`;
  } else {
    const items = await (await fetch(`/api/raw/${state.section}/${d.date}`)).json();
    state.raw = { items: Array.isArray(items) ? items : (items.items || []), source: "all", keyword: "", q: "", shown: 60 };
    renderRaw();
  }
}
function renderRaw() {
  const r = state.raw; const box = $("#content");
  const sources = {}; const keywords = {};
  r.items.forEach((it) => { sources[it.source] = (sources[it.source] || 0) + 1; keywords[it.keyword] = (keywords[it.keyword] || 0) + 1; });
  const q = r.q.trim().toLowerCase();
  const list = r.items.filter((it) => (r.source === "all" || it.source === r.source)
      && (!r.keyword || it.keyword === r.keyword)
      && (!q || (it.title + " " + it.description).toLowerCase().includes(q)))
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  box.innerHTML = `<div class="doc">
    <div class="filters">
      <button class="chip ${r.source === "all" ? "on" : ""}" data-s="all">전체 ${r.items.length}</button>
      ${Object.entries(sources).map(([s, n]) => `<button class="chip ${r.source === s ? "on" : ""}" data-s="${esc(s)}">${esc(srcLabel(s))} ${n}</button>`).join("")}
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="제목·내용 검색" value="${esc(r.q)}">
      <select id="kw"><option value="">키워드 전체 (${Object.keys(keywords).length})</option>
        ${Object.entries(keywords).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<option value="${esc(k)}" ${k === r.keyword ? "selected" : ""}>${esc(k)} (${n})</option>`).join("")}
      </select>
    </div>
    <div class="meta" style="margin-bottom:10px">${list.length}건</div>
    ${list.slice(0, r.shown).map((it) => `<div class="item">
        <a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>
        <div class="info"><span>${esc(srcLabel(it.source))}</span><span>#${esc(it.keyword)}</span>
          ${it.date ? `<span>${new Date(it.date).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span>` : ""}</div>
        ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ""}
      </div>`).join("") || '<div class="empty">조건에 맞는 항목이 없어요.</div>'}
    ${list.length > r.shown ? `<button class="ghost more" id="more">더 보기 (${list.length - r.shown}건 남음)</button>` : ""}
  </div>`;
  box.querySelectorAll(".chip").forEach((b) => b.onclick = () => { r.source = b.dataset.s; r.shown = 60; renderRaw(); });
  const qi = $("#q"); qi.oninput = () => { r.q = qi.value; r.shown = 60; clearTimeout(qi._t); qi._t = setTimeout(() => { renderRaw(); const n = $("#q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 200); };
  $("#kw").onchange = (e) => { r.keyword = e.target.value; r.shown = 60; renderRaw(); };
  const more = $("#more"); if (more) more.onclick = () => { r.shown += 60; renderRaw(); };
}

$("#reload").onclick = async () => { await loadList(); renderMain(); };
loadList().then(renderMain).catch((e) => { $("#main").innerHTML = `<div class="empty">서버에 연결할 수 없어요: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
